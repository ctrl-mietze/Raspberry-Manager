name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/source/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/source/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Compile and unit-test Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and execute JVM tests
        working-directory: android/source
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest

      - name: Save unsigned-for-production debug build
        uses: actions/upload-artifact@v4
        with:
          name: RaspberryManager-Android-Debug-CI
          path: android/source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaspberryManager-Android-UnitTests
          path: android/source/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
